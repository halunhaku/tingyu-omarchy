# Go client CI on Linux, the platform this fork targets.
#
# The macOS workflow builds the .app and DMG; this one answers the other
# question: does the shared client still build and test on Linux, and did a
# Linux change break the Windows or macOS build? Both read the Go version from
# client/go.mod, so the two workflows cannot drift apart.
#
# Tests run with -short and skip the three 16.7 ms frame-budget gates
# (TestLibraryScrollP95At10000Rows, TestTenThousandRowPaging,
# TestStageFrameBudget): they measure a machine, not the code, and a shared
# runner lands at 16.5-42 ms. They stay in `go test ./...` on a developer
# machine, which is where they were tuned.
name: Go client (Linux)

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/linux.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/linux.yml'
  workflow_dispatch:

concurrency:
  group: go-client-linux-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client

env:
  # The client loads GTK, WebKitGTK, libsecret and libmpv at run time through
  # purego, so the build itself needs no C toolchain.
  CGO_ENABLED: '0'

jobs:
  linux:
    name: format, vet, test, cross-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: client/go.mod
          cache: true
          cache-dependency-path: client/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt wants to change these files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -short
        run: |
          go test -short -count=1 \
            -skip 'TestLibraryScrollP95At10000Rows|TestTenThousandRowPaging|TestStageFrameBudget' \
            ./...

      - name: Cross-build Windows and macOS
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...

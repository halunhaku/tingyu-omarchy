# Go client CI on Linux, the platform this fork targets.
#
# The macOS workflow builds the .app and DMG; this one answers the other
# question: does the shared client still build and test on Linux, and did a
# Linux change break the Windows or macOS build? Both read the Go version from
# client/go.mod, so the two workflows cannot drift apart.
#
# Tests run with -short: the 10,000-row scroll gate in internal/shell is tuned
# for 16.7 ms frames and lands at 16.7-17.6 ms on the Omarchy box, so a plain
# run would be red on timing noise rather than on a regression. The gate still
# runs in the macOS job, where it was tuned.
name: Go client (Linux)

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/linux.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/linux.yml'
  workflow_dispatch:

concurrency:
  group: go-client-linux-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client

env:
  # The client loads GTK, WebKitGTK, libsecret and libmpv at run time through
  # purego, so the build itself needs no C toolchain.
  CGO_ENABLED: '0'

jobs:
  linux:
    name: format, vet, test, cross-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: client/go.mod
          cache: true
          cache-dependency-path: client/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt wants to change these files:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -short
        run: go test -short -count=1 ./...

      - name: Cross-build Windows and macOS
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
